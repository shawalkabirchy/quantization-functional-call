# Qwen3-8B in FP16 with an 8-bit KV cache (FP8 E4M3), thinking mode off. About 16 GB of weights: split across both T4s
model: Qwen/Qwen3-8B
revision: b968826d9c46dd6066d109eabc6255188de91218    # Hugging Face commit, pinned on 2026-10-12
precision: fp16-kv8          # weights as in the FP16 run; only the KV cache changes (stretch item, Update 13)
dtype: half                  # FP16; T4 GPUs do not support BF16
quantization: null
tensor_parallel_size: 2
max_model_len: 8192          # longest non-live prompt is about 1,250 tokens, plus 4,096 for the answer
gpu_memory_utilization: 0.90
llm_kwargs:                  # plain NCCL between the two T4s (PCIe, no NVLink); 8-bit KV cache
  disable_custom_all_reduce: true
  kv_cache_dtype: fp8        # FP8 E4M3, scale 1.0 (the checkpoint has no KV scales); vLLM converts on the fly, the T4 has no FP8 hardware
chat_template_kwargs: {enable_thinking: false}
sampling:                    # greedy decoding; every value is set, nothing comes from generation_config
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  min_p: 0.0
  repetition_penalty: 1.0
  seed: 42
  max_tokens: 4096           # same answer budget as BFCL
