# Qwen3-8B in AWQ 4-bit (weights 4-bit, activations FP16, groups of 128), thinking mode off
model: Qwen/Qwen3-8B
revision: b968826d9c46dd6066d109eabc6255188de91218    # Hugging Face commit, pinned on 2026-10-12
precision: awq
dtype: half                  # activations and the parts that are not quantized (embeddings, norms) run in FP16
quantization: awq            # vLLM's AWQ GEMM kernels (its faster Marlin kernels need a newer GPU than the T4)
quantize:                    # src/quantize.py makes the checkpoint with GPTQModel (calibration set: CALIBRATION there)
  method: awq
  bits: 4
  group_size: 128
  zero_point: true           # asymmetric (with zero points), the usual AWQ setting
  batch_size: 16             # samples per forward pass; all 256 at once ran out of memory on a T4
  fp16_copy: true            # load from an FP16 copy on disk: with the weights in RAM, this job stopped in its first layer
                             # with no error, most likely out of system memory
  x_mean_floor: 0.001        # with max_scale: without these limits, silent channels gave scales up to 2450, and
  max_scale: 100             # layer 2's up_proj overflowed FP16 (65,504), which turned everything after it into NaN
tensor_parallel_size: 1      # 4-bit Qwen3-8B fits on one T4 (FP16 needed both)
max_model_len: 8192          # longest non-live prompt is about 1,250 tokens, plus 4,096 for the answer
gpu_memory_utilization: 0.90
chat_template_kwargs: {enable_thinking: false}
sampling:                    # greedy decoding; every value is set, nothing comes from generation_config
  temperature: 0.0
  top_p: 1.0
  top_k: -1
  min_p: 0.0
  repetition_penalty: 1.0
  seed: 42
  max_tokens: 4096           # same answer budget as BFCL
